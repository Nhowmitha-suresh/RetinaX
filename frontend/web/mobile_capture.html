<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RetinaX — Mobile Retinal Camera</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #032E2A;
      --card-bg: #064F49;
      --teal-primary: #10B8AE;
      --teal-bright: #18C7BE;
      --text-light: #FFFFFF;
      --text-muted: #A3C2BF;
      --border-teal: rgba(24, 199, 190, 0.25);
      --error-red: #D94B5B;
      --success-green: #10B8AE;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .mobile-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border-teal);
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .brand-title {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
    }

    .brand-accent {
      color: var(--teal-bright);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 184, 174, 0.2);
      border: 1px solid var(--teal-primary);
      color: var(--teal-bright);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--teal-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--teal-bright);
    }

    .mobile-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-teal);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }

    .camera-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 2px dashed var(--teal-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Retinal Scanning Alignment Circle */
    .retinal-guide-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .guide-circle {
      width: 68%;
      aspect-ratio: 1;
      border: 2px dashed var(--teal-bright);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45), 0 0 20px var(--teal-bright);
    }

    .guide-label {
      margin-top: 12px;
      background: rgba(3, 46, 42, 0.9);
      color: var(--teal-bright);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid var(--border-teal);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal-primary) 0%, #075A53 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(16, 184, 174, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-retake {
      background: linear-gradient(135deg, var(--error-red) 0%, #B91C1C 100%);
      color: #FFFFFF;
    }

    .feedback-banner {
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .feedback-banner.info {
      display: flex;
      background: rgba(16, 184, 174, 0.15);
      border: 1px solid var(--teal-primary);
      color: #CCFBF1;
    }

    .feedback-banner.fail {
      display: flex;
      background: rgba(217, 75, 91, 0.15);
      border: 1px solid var(--error-red);
      color: #FECDD3;
    }

    .feedback-banner.pass {
      display: flex;
      background: rgba(16, 184, 174, 0.2);
      border: 1px solid var(--teal-bright);
      color: #A7F3D0;
    }
  </style>
</head>
<body>

  <header class="mobile-header">
    <div class="brand-title">
      RETINA<span class="brand-accent">X</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      CONNECTED
    </div>
  </header>

  <div class="mobile-card">
    <div style="text-align: center;">
      <h2 style="font-family: 'Manrope', sans-serif; font-size: 1.15rem;">RETINAX MOBILE CAMERA</h2>
      <p style="font-size: 0.82rem; color: var(--text-muted); margin-top: 2px;">Align eye inside circular guide to capture fundus scan</p>
    </div>

    <!-- VIEWFINDER FRAME -->
    <div class="camera-frame">
      <video id="cameraVideo" autoplay playsinline style="display: none;"></video>
      <img id="capturedImage" src="" alt="Captured Retinal Scan" style="display: none;">

      <div class="retinal-guide-overlay" id="guideOverlay">
        <div class="guide-circle"></div>
        <div class="guide-label">CENTER THE RETINAL IMAGE</div>
      </div>
    </div>

    <div class="feedback-banner" id="feedbackBanner">
      <div style="font-weight: 700;" id="feedbackTitle"></div>
      <div style="font-size: 0.8rem; opacity: 0.9;" id="feedbackDesc"></div>
    </div>

    <!-- CONTROLS (NO EMOJIS, LUCIDE SVG ICONS) -->
    <div class="btn-group">
      <button class="btn btn-primary" id="openCamBtn" onclick="initCamera()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Open Camera
      </button>

      <button class="btn btn-primary" id="captureBtn" onclick="takeSnapshot()" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
        CAPTURE IMAGE
      </button>

      <button class="btn btn-secondary" id="fileBtn" onclick="document.getElementById('fileInput').click()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        CHOOSE FILE
      </button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display: none;" onchange="handleFile(event)">

      <button class="btn btn-primary" id="sendBtn" onclick="sendToRetinax()" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        SEND TO RETINAX
      </button>

      <button class="btn btn-retake" id="retakeBtn" onclick="resetCapture()" style="display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        RETAKE
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    const token = urlParams.get('token');

    let videoStream = null;
    let imageBlob = null;

    async function initCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        const video = document.getElementById('cameraVideo');
        video.srcObject = videoStream;
        video.style.display = 'block';

        document.getElementById('capturedImage').style.display = 'none';
        document.getElementById('openCamBtn').style.display = 'none';
        document.getElementById('fileBtn').style.display = 'none';
        document.getElementById('captureBtn').style.display = 'flex';
        
        showFeedback('info', 'Camera Active', 'Align retinal image inside guide and press CAPTURE IMAGE.');
      } catch (err) {
        console.warn('Camera stream error, fallback to file upload:', err);
        document.getElementById('fileInput').click();
      }
    }

    function takeSnapshot() {
      const video = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        imageBlob = blob;
        const url = URL.createObjectURL(blob);

        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
        }

        video.style.display = 'none';
        const img = document.getElementById('capturedImage');
        img.src = url;
        img.style.display = 'block';

        document.getElementById('captureBtn').style.display = 'none';
        document.getElementById('sendBtn').style.display = 'flex';
        document.getElementById('retakeBtn').style.display = 'flex';

        showFeedback('info', 'Image Captured', 'Review scan. Click SEND TO RETINAX to transmit to desktop session.');
      }, 'image/jpeg', 0.92);
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) {
        imageBlob = file;
        const url = URL.createObjectURL(file);

        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
        }

        document.getElementById('cameraVideo').style.display = 'none';
        const img = document.getElementById('capturedImage');
        img.src = url;
        img.style.display = 'block';

        document.getElementById('openCamBtn').style.display = 'none';
        document.getElementById('fileBtn').style.display = 'none';
        document.getElementById('captureBtn').style.display = 'none';
        document.getElementById('sendBtn').style.display = 'flex';
        document.getElementById('retakeBtn').style.display = 'flex';

        showFeedback('info', 'Image Loaded', 'Click SEND TO RETINAX to transmit scan to desktop session.');
      }
    }

    async function sendToRetinax() {
      if (!imageBlob || !sessionId || !token) {
        alert('Invalid session context. Please scan QR code from RetinaX screen.');
        return;
      }

      showFeedback('info', 'Transferring Scan...', 'Sending image to RetinaX desktop session...');
      document.getElementById('sendBtn').disabled = true;

      const formData = new FormData();
      formData.append('file', imageBlob, 'mobile_fundus.jpg');
      formData.append('token', token);

      try {
        const response = await fetch(`/api/mobile/session/${sessionId}/image`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();
        document.getElementById('sendBtn').disabled = false;

        if (response.ok && data.status === 'success') {
          showFeedback('pass', 'Transfer Complete', 'Retinal scan successfully sent to RetinaX desktop. Check desktop screen for validation.');
          document.getElementById('sendBtn').style.display = 'none';
        } else {
          showFeedback('fail', 'Transfer Failed', data.detail || data.message || 'Error transmitting scan.');
        }
      } catch (err) {
        console.error(err);
        showFeedback('fail', 'Connection Error', 'Network error during image transfer. Check Wi-Fi connection.');
        document.getElementById('sendBtn').disabled = false;
      }
    }

    function resetCapture() {
      imageBlob = null;
      document.getElementById('capturedImage').style.display = 'none';
      document.getElementById('sendBtn').style.display = 'none';
      document.getElementById('retakeBtn').style.display = 'none';
      document.getElementById('openCamBtn').style.display = 'flex';
      document.getElementById('fileBtn').style.display = 'flex';
      document.getElementById('feedbackBanner').style.display = 'none';
      initCamera();
    }

    function showFeedback(type, title, desc) {
      const banner = document.getElementById('feedbackBanner');
      banner.className = `feedback-banner ${type}`;
      document.getElementById('feedbackTitle').innerText = title;
      document.getElementById('feedbackDesc').innerText = desc;
      banner.style.display = 'flex';
    }
  </script>
</body>
</html>
