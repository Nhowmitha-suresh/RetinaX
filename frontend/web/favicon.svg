<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E2B"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect width="94" height="94" x="3" y="3" rx="21" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Retinal Scanner Grid Marks -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#2DD4BF" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#irisGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Retinal Aperture / Crosshair -->
  <line x1="50" y1="14" x2="50" y2="22" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="50" y2="86" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="22" y2="50" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="86" y2="50" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eye Pupil / AI Core -->
  <ellipse cx="50" cy="50" rx="16" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="50" cy="50" r="7" fill="url(#irisGrad)" filter="url(#glow)"/>
  <circle cx="48" cy="48" r="2.5" fill="#FFFFFF"/>
</svg>
